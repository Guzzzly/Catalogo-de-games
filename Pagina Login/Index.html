<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | ProjetoWEB</title>
</head>
<body>
  <form action="#" method="post">
    <div class="marca"><span class="icone" aria-hidden="true">▶</span>TrabalhoWEB</div>

    <div class="titulo">
      <h1>Entrar na conta</h1>
      <p>Sua próxima partida começa aqui.</p>
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="usuario@gmail.com" autocomplete="email" required>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="senha">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" minlength="6" required>
        <button type="button" class="alternar" id="alternar" aria-controls="senha">Mostrar</button>
      </div>
    </div>

    <button type="submit" class="entrar">Entrar e jogar</button>

    <p class="rodape">Novo por aqui? <a href="#">Criar conta grátis</a></p>
  </form>
</body>
</html>
